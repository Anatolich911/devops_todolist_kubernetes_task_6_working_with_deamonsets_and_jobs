apiVersion: batch/v1
kind: CronJob
metadata:
  name: myjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      
      template:
        spec:
          containers:
          - name: busyboxcronjob
            image: busyboxplus:curl
            command:
            - /bin/sh
            - -c
            - curl http://localhost:8080/api/health
          restartPolicy: OnFailure
